[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyrecon"
version = "0.2.0"
description = "Author-keyword reconstruction with Adaptive Composite Keyword Scoring (Adaptive CKS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Byong-Rae Ryu"},
  {name = "Sunghwa Lee"},
]
keywords = [
  "keyword reconstruction",
  "author keywords",
  "bibliometrics",
  "keyphrase extraction",
  "spaCy",
  "Adaptive CKS",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
]

[project.optional-dependencies]
nlp = [
  "spacy>=3.8,<4",
]
transformers = [
  "spacy>=3.8,<4",
  "spacy-transformers>=1.3,<2",
]
korean = [
  "kiwipiepy==0.23.2",
]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
]

[project.scripts]
keyrecon = "keyrecon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyrecon = ["profiles/*.json", "resources/ko_reference_v1/*.json", "resources/ko_reference_v1/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
